# Phase 0 scaffolding — no Swift sources yet, so keep the config permissive
# but present, so `make lint` / `make format` work the moment they are installed.
included:
  - Sources
  - Tests

excluded:
  - .build
  - dist
  - build

disabled_rules:
  # Menu-bar utilities legitimately have few public types early on
  - trailing_whitespace
  # AppKit/SwiftUI delegate and notification plumbing uses @objc
  - identifier_name

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - last_where
  - literal_expression_end_indentation
  - modifier_order
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces
  - yoda_condition

line_length:
  warning: 120
  error: 160

file_length:
  warning: 500
  error: 900

type_body_length:
  warning: 350

function_body_length:
  warning: 80

identifier_name:
  min_length: 2
  excluded:
    - id
    - to
    - up

nesting:
  type_level: 2

reporter: xcode
